<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URBAN — Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 2px;
        }

        header button {
            background: white;
            color: #111;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        main {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat p {
            font-size: 30px;
            font-weight: bold;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .panel h2 {
            margin-bottom: 25px;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form input,
        .form textarea,
        .form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        .add-btn {
            background: #111;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            opacity: 0.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #fafafa;
        }

        .product-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
        }

        .delete-btn {
            background: #d11;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn {
            background: #111;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: #dff5df;
            color: #176b17;
        }

        .error {
            background: #ffdede;
            color: #a00000;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .form {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }
        }

        @media (max-width: 600px) {

            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px 20px;
            }

            main {
                margin-top: 20px;
            }

            .panel {
                padding: 20px;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>URBAN ADMIN</h1>

    <button onclick="logout()">
        Выйти
    </button>

</header>


<main>

    <div class="stats">

        <div class="stat">
            <h3>ТОВАРЫ</h3>
            <p id="productsCount">0</p>
        </div>

        <div class="stat">
            <h3>ПОЛЬЗОВАТЕЛИ</h3>
            <p id="usersCount">0</p>
        </div>

        <div class="stat">
            <h3>ТОВАРОВ В КОРЗИНАХ</h3>
            <p id="cartCount">0</p>
        </div>

        <div class="stat">
            <h3>ТОВАРОВ НА СКЛАДЕ</h3>
            <p id="stockCount">0</p>
        </div>

    </div>


    <section class="panel">

        <h2>
            Добавить товар
        </h2>

        <form
            id="productForm"
            class="form"
        >

            <input
                id="productName"
                type="text"
                placeholder="Название товара"
                required
            >

            <input
                id="productPrice"
                type="number"
                step="0.01"
                placeholder="Цена"
                required
            >

            <input
                id="productStock"
                type="number"
                placeholder="Количество"
                required
            >

            <input
                id="productCategory"
                type="text"
                placeholder="Категория"
            >

            <input
                id="productImage"
                class="full"
                type="text"
                placeholder="URL изображения"
            >

            <textarea
                id="productDescription"
                class="full"
                placeholder="Описание товара"
            ></textarea>

            <button
                class="add-btn full"
                type="submit"
            >
                ДОБАВИТЬ ТОВАР
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

    </section>


    <section class="panel">

        <h2>
            Товары
        </h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Фото</th>
                    <th>Название</th>
                    <th>Цена</th>
                    <th>Склад</th>
                    <th>Категория</th>
                    <th>Действия</th>

                </tr>

            </thead>

            <tbody id="productsTable">

            </tbody>

        </table>

    </section>


    <section class="panel">

        <h2>
            Пользователи
        </h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Дата регистрации</th>

                </tr>

            </thead>

            <tbody id="usersTable">

            </tbody>

        </table>

    </section>

</main>


<script>

async function checkAdmin() {

    try {

        const response =
            await fetch(
                "/api/admin/check"
            );

        const data =
            await response.json();

        if (!data.success) {

            alert(
                "У вас нет доступа к админ-панели"
            );

            window.location.href = "/";

            return false;
        }

        return true;

    } catch (error) {

        console.error(error);

        alert(
            "Ошибка подключения к серверу"
        );

        return false;
    }
}


async function loadStats() {

    const response =
        await fetch(
            "/api/admin/stats"
        );

    const data =
        await response.json();

    if (!data.success) {
        return;
    }

    document.getElementById(
        "productsCount"
    ).textContent =
        data.stats.products;

    document.getElementById(
        "usersCount"
    ).textContent =
        data.stats.users;

    document.getElementById(
        "cartCount"
    ).textContent =
        data.stats.cartItems;

    document.getElementById(
        "stockCount"
    ).textContent =
        data.stats.totalStock;
}


async function loadProducts() {

    const response =
        await fetch(
            "/api/admin/products"
        );

    const data =
        await response.json();

    const table =
        document.getElementById(
            "productsTable"
        );

    table.innerHTML = "";

    if (
        !data.success ||
        !data.products.length
    ) {

        table.innerHTML = `
            <tr>
                <td colspan="7">
                    Товаров пока нет
                </td>
            </tr>
        `;

        return;
    }

    data.products.forEach(
        product => {

            const row =
                document.createElement(
                    "tr"
                );

            row.innerHTML = `

                <td>
                    ${product.id}
                </td>

                <td>

                    ${
                        product.image
                            ? `
                                <img
                                    class="product-image"
                                    src="${product.image}"
                                    alt=""
                                >
                              `
                            : "-"
                    }

                </td>

                <td>
                    ${escapeHtml(
                        product.name
                    )}
                </td>

                <td>
                    ${Number(
                        product.price
                    ).toFixed(2)} zł
                </td>

                <td>
                    ${product.stock}
                </td>

                <td>
                    ${
                        product.category || "-"
                    }
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editProduct(${product.id})"
                    >
                        Изменить
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${product.id})"
                    >
                        Удалить
                    </button>

                </td>

            `;

            table.appendChild(row);

        }
    );
}


async function loadUsers() {

    const response =
        await fetch(
            "/api/admin/users"
        );

    const data =
        await response.json();

    const table =
        document.getElementById(
            "usersTable"
        );

    table.innerHTML = "";

    if (
        !data.success ||
        !data.users.length
    ) {

        table.innerHTML = `
            <tr>
                <td colspan="4">
                    Пользователей пока нет
                </td>
            </tr>
        `;

        return;
    }

    data.users.forEach(
        user => {

            const row =
                document.createElement(
                    "tr"
                );

            row.innerHTML = `

                <td>
                    ${user.id}
                </td>

                <td>
                    ${escapeHtml(
                        user.name
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        user.email
                    )}
                </td>

                <td>
                    ${
                        user.created_at
                            ? new Date(
                                user.created_at
                              ).toLocaleString()
                            : "-"
                    }
                </td>

            `;

            table.appendChild(row);

        }
    );
}


document.getElementById(
    "productForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const product = {

            name:
                document.getElementById(
                    "productName"
                ).value,

            price:
                Number(
                    document.getElementById(
                        "productPrice"
                    ).value
                ),

            stock:
                Number(
                    document.getElementById(
                        "productStock"
                    ).value
                ),

            category:
                document.getElementById(
                    "productCategory"
                ).value,

            image:
                document.getElementById(
                    "productImage"
                ).value,

            description:
                document.getElementById(
                    "productDescription"
                ).value

        };


        try {

            const response =
                await fetch(
                    "/api/admin/products",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                product
                            )

                    }
                );

            const data =
                await response.json();

            if (!data.success) {

                showMessage(
                    data.message ||
                    "Ошибка",
                    true
                );

                return;
            }

            showMessage(
                "Товар успешно добавлен"
            );

            this.reset();

            await loadProducts();

            await loadStats();

        } catch (error) {

            console.error(error);

            showMessage(
                "Ошибка подключения к серверу",
                true
            );
        }
    }
);


async function deleteProduct(id) {

    const confirmed =
        confirm(
            "Удалить этот товар?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/admin/products/${id}`,
                {
                    method:
                        "DELETE"
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            showMessage(
                data.message ||
                "Ошибка удаления",
                true
            );

            return;
        }

        showMessage(
            "Товар удалён"
        );

        await loadProducts();

        await loadStats();

    } catch (error) {

        console.error(error);

        showMessage(
            "Ошибка подключения к серверу",
            true
        );
    }
}


async function editProduct(id) {

    const price =
        prompt(
            "Введите новую цену:"
        );

    if (
        price === null
    ) {
        return;
    }

    const stock =
        prompt(
            "Введите новое количество:"
        );

    if (
        stock === null
    ) {
        return;
    }

    try {

        const priceResponse =
            await fetch(
                `/api/admin/products/${id}/price`,
                {

                    method:
                        "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            price:
                                Number(price)
                        })

                }
            );

        const priceData =
            await priceResponse.json();

        if (!priceData.success) {

            showMessage(
                priceData.message ||
                "Ошибка изменения цены",
                true
            );

            return;
        }


        const stockResponse =
            await fetch(
                `/api/admin/products/${id}/stock`,
                {

                    method:
                        "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            stock:
                                Number(stock)
                        })

                }
            );

        const stockData =
            await stockResponse.json();

        if (!stockData.success) {

            showMessage(
                stockData.message ||
                "Ошибка изменения склада",
                true
            );

            return;
        }

        showMessage(
            "Товар обновлён"
        );

        await loadProducts();

        await loadStats();

    } catch (error) {

        console.error(error);

        showMessage(
            "Ошибка подключения к серверу",
            true
        );
    }
}


async function logout() {

    await fetch(
        "/api/logout",
        {
            method:
                "POST"
        }
    );

    window.location.href =
        "/";
}


function showMessage(
    message,
    isError = false
) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        message;

    element.className =
        "message " +
        (
            isError
                ? "error"
                : "success"
        );

    element.style.display =
        "block";

    setTimeout(
        () => {

            element.style.display =
                "none";

        },
        3000
    );
}


function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


async function init() {

    const isAdmin =
        await checkAdmin();

    if (!isAdmin) {
        return;
    }

    await loadStats();

    await loadProducts();

    await loadUsers();
}


init();

</script>

</body>
</html>
